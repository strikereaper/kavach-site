name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Works out the public URL: https://<user>.github.io/<repo>/ by default,
      # or your custom domain once one is set in Settings > Pages.
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://example.com' }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}

      - name: Check links
        run: npm run check-links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
